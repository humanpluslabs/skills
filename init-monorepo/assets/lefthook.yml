# This file configures actions which run on git hook lifecycle steps. Whenever any edits have been made to this file, ensure you run `pnpm exec lefthook install` to update the hooks directory.

pre-commit:
  jobs:
    - name: spell-check
      run: pnpm exec cspell --no-must-find-files {staged_files}
    # Lint and format staged files
    - name: biome-check
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    # Type check entire codebase
    - name: type-check
      run: pnpm run typecheck

commit-msg:
  jobs:
    # Strip Co-Authored-By lines (interferes with commit signature verification)
    - name: strip-co-author
      run: sed -i.bak '/^Co-Authored-By:/d' {1} && rm -f {1}.bak
